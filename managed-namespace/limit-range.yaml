apiVersion: v1
kind: LimitRange
metadata:
  name: dev-team-alpha-limits
  namespace: dev-team-alpha
spec:
  limits:
    - type: Container
      max:
        cpu: 500m
        memory: 256Mi
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
