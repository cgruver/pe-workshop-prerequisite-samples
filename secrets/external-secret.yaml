apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: workshop-sample
  namespace: prerequisite-samples
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-secret-store
    kind: ClusterSecretStore
  target:
    name: workshop-sample
    creationPolicy: Owner
  data:
    - secretKey: MESSAGE
      remoteRef:
        key: secrets/workshop/sample-secret
        property: message
